<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دوغ آب علی</title>
    <link rel="stylesheet" href="/src/main.css">
</head>

<body class="bg-gray-100 min-h-screen">
    <!-- hero -->
    <header class="bg-abali-darya">
        <nav class="container">
            <div class="relative">
                <div
                    class="flex justify-between items-center pt-5 pb-6 z-10 relative px-[60px] bg-white rounded-b-[22px]">
                    <div>
                        <!-- animated hamburger menu -->
                        <button id="hamburger"
                            class="flex flex-col justify-center items-center w-10 h-10 gap-[6px] cursor-pointer"
                            aria-label="Menu">
                            <span
                                class="hamburger-line block w-6 h-[3px] bg-abali-darya rounded-full transition-all duration-300 ease-in-out"></span>
                            <span
                                class="hamburger-line block w-6 h-[3px] bg-abali-darya rounded-full transition-all duration-300 ease-in-out"></span>
                            <span
                                class="hamburger-line block w-6 h-[3px] bg-abali-darya rounded-full transition-all duration-300 ease-in-out"></span>
                        </button>
                    </div>

                    <!-- logo (absolute center) -->
                    <img class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 h-[60px] w-fit" src="images/Logo.png" alt="دوغ ابعلی">
                    
                    <div class="flex gap-[14px]">
                        <!-- cart button -->
                        <button class="p-2 bg-[#F0F0F0] rounded-lg">
                            <img src="public/icons/shopping-cart.svg" alt="cart icon">
                        </button>
                        </button>

                        <button
                            class="flex rounded-lg gap-2 h-[38px] pl-2 pr-6 bg-abali-darya text-white text-xs font-bold items-center">
                            <span>ثبت نام یا ورود</span>
                            <img class="size-6" src="public/icons/profile-2user.svg" alt="person icon">
                        </button>
                    </div>
                </div>
                <div class="h-[105px] relative -top-10 rounded-[22px] pb-[22px] mx-3 bg-[#345B85]">
                    <div class="text-base text-white font-semibold flex gap-10 justify-center items-end h-full">
                        <a href="/"> نظرات شما</a>
                        <a href="/">خرید آنلاین </a>
                        <a href="/">آشنایی با ما </a>
                        <a href="/">ویژگی ها</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
