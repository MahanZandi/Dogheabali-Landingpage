<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دوغ آب علی</title>
    <link rel="icon" type="image/svg+xml" href="/images/dogh-3.svg">
    <link rel="stylesheet" href="/src/main.css">
</head>

<body dir="rtl" class="bg-gray-100 min-h-screen overflow-x-hidden">
    <!-- hero -->
    <header class="bg-abali-darya pb-[147px] rounded-b-[48px]">
        <nav class="container">
            <div class="relative">
                <div
                    class="flex justify-between items-center pt-5 pb-6 z-10 relative px-[60px] bg-white rounded-b-[22px]">
                    <div>
                        <!-- animated hamburger menu -->
                        <button id="hamburger"
                            class="flex flex-col justify-center items-center w-10 h-10 gap-[6px] cursor-pointer"
                            aria-label="Menu">
                            <span
                                class="hamburger-line block w-6 h-[3px] bg-abali-darya rounded-full transition-all duration-300 ease-in-out"></span>
                            <span
                                class="hamburger-line block w-6 h-[3px] bg-abali-darya rounded-full transition-all duration-300 ease-in-out"></span>
                            <span
                                class="hamburger-line block w-6 h-[3px] bg-abali-darya rounded-full transition-all duration-300 ease-in-out"></span>
                        </button>
                    </div>

                    <!-- logo (absolute center) -->
                    <img class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 h-[60px] w-fit"
                        src="images/Logo.svg" alt="دوغ ابعلی">

                    <div class="flex gap-[14px]">
                        <!-- cart button -->
                        <button class="p-2 bg-[#F0F0F0] rounded-lg">
                            <img src="images/icons/shopping-cart.svg" alt="cart icon">
                        </button>

                        <button
                            class="flex rounded-lg gap-2 h-[38px] pl-2 pr-6 bg-abali-darya text-white text-xs font-bold items-center">
                            <span>ثبت نام یا ورود</span>
                            <img class="size-6" src="images/icons/profile-2user.svg" alt="person icon">
                        </button>
                    </div>
                </div>
                <div class="h-[105px] relative -top-10 rounded-[22px] pb-4 mx-3 bg-[#345B85]">
                    <nav id="nav-links"
                        class="relative text-base text-white font-semibold flex gap-10 justify-center items-end h-full">
                        <a href="/" class="nav-link relative pb-1"> نظرات شما</a>
                        <a href="/" class="nav-link relative pb-1">خرید آنلاین </a>
                        <a href="/" class="nav-link relative pb-1">آشنایی با ما </a>
                        <a href="/" class="nav-link relative pb-1">ویژگی ها</a>
                        <span id="nav-indicator"
                            class="absolute bottom-0 h-[2px] bg-white rounded-full transition-all duration-300 ease-out"></span>
                    </nav>
                </div>
            </div>
        </nav>

        <!-- hero title -->
        <div class="mt-[75px] flex justify-center relative">
            <!-- halo 1 (top-right, near "دوغت") -->
            <div
                class="absolute -top-20 -right-20 w-[411px] h-[411px] rounded-full bg-white/39 blur-[100px] pointer-events-none">
            </div>

            <!-- halo 2 (right, near "بنوش") -->
            <div
                class="absolute top-44 -right-40 w-[411px] h-[411px] rounded-full bg-white/25 blur-[100px] pointer-events-none">
            </div>

            <div class="text-white flex flex-col items-center">
                <h2 class="px-5 py-[10px] text-[28px] font-medium bg-white/20 rounded-lg w-fit flex gap-2 items-center">
                    <span> با آبعلی خاطره هات رو به یادماندنی کن </span> <img src="images/icon.png" class="size-8"
                        alt="">
                </h2>

                <h2 class="text-[120px] font-black">
                    دوغـت رو بنــــوش!
                </h2>
                <div class="mt-[11px] lg:pr-36 w-full flex gap-3">
                    <span class="text-white text-2xl">از اینجا بازش کن!</span>
                    <img src="images/icons/Arrow.png" alt="Arrow">
                </div>
            </div>
        </div>

        <!-- header background -->
        <div class="mt-[170px] flex justify-center relative">
            <!-- halo 3 (below yellow bg, left of center item) -->
            <div
                class="absolute -bottom-40 -left-32 w-[411px] h-[411px] rounded-full bg-white/39 blur-[100px] pointer-events-none">
            </div>
            <div class="relative">
                <img src="images/yellow-background.png" alt="yellow-background">

                <img class="absolute -top-36 -right-10 z-10" src="images/dogh-1.svg" alt="دوغ آبعلی">
                <div class="relative">
                    <div class="absolute bottom-28 right-44">
                        <img src="images/Subtract-r.svg" alt="Subtract">
                        <div
                            class="absolute flex items-center justify-center -top-1.5 -left-2 bg-white rounded-full size-[58px]">
                            <img class="size-6" src="images/icons/arrow-circle-left.svg" alt="arrow">
                        </div>
                        <!-- text overlay -->
                        <div class="absolute top-1/2 -translate-y-1/2 right-12 flex items-center gap-3">
                            <div class="rounded-2xl text-center w-[250px]">
                                <h3 class="text-abali-darya text-2xl font-semibold">قوطی</h3>
                                <p class="text-abali-darya text-sm">۳۳۰ میلی لیتر</p>
                            </div>
                        </div>
                    </div>
                </div>

                <img class="absolute -top-56 -left-10 z-10" src="images/dogh-2.svg" alt="دوغ آبعلی">
                <div class="absolute bottom-28 left-44">
                    <img src="images/Subtract-l.svg" alt="Subtract">
                    <div
                        class="absolute flex items-center justify-center -top-1 -right-2 bg-white rounded-full size-[58px]">
                        <img class="size-6 rotate-180" src="images/icons/arrow-circle-left.svg" alt="arrow">
                    </div>
                    <!-- text overlay -->
                    <div class="absolute top-1/2 -translate-y-1/2 left-12 flex items-center gap-3">
                        <div class="rounded-2xl text-center w-[250px]">
                            <h3 class="text-abali-darya text-2xl font-semibold">خانواده</h3>
                            <p class="text-abali-darya text-sm">۱/۵ لیتر</p>
                        </div>
                    </div>
                </div>
                <!-- center hero image dogh -->
                <div id="dogh-animation"
                    class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 overflow-visible">
                    <img id="dogh-main" class="dogh-animated" src="images/dogh.svg" alt="دوغ آبعلی">
                    <div id="dogh-frame-2-wrapper" class="hidden relative">
                        <img id="dogh-frame-2" class="dogh-frame-2" src="images/dogh-frame-2.png" alt="دوغ آبعلی">
                        <div id="dogh-steam"
                            class="hidden absolute top-4 left-1/2 -translate-x-1/2 pointer-events-none z-10">
                            <div class="steam-particle steam-p1"></div>
                            <div class="steam-particle steam-p2"></div>
                            <div class="steam-particle steam-p3"></div>
                            <div class="steam-particle steam-p4"></div>
                        </div>
                    </div>
                    <img id="dogh-frame-3" class="hidden dogh-frame-3 absolute -top-8 left-1/2 -translate-x-1/2"
                        src="images/dogh-frame-3.png" alt="دوغ آبعلی">
                </div>
            </div>
        </div>

    </header>

    <!-- main content -->
    <main class="container flex flex-col">

        <section class="py-[124px] flex justify-between">
            <div class="flex flex-col gap-[42px] justify-center">
                <span class="text-[32px] font-bold w-fit bg-abali-zafaran py-2 px-3 rounded-md text-[#0E0E0E]">ویژگی های
                    دوغ آبعلی</span>
                <span class="text-abali-darya font-black text-[52px]">اصیل ترین نوشیدنی ایرانی</span>
                <span class="max-w-[478px] text-2xl font-light text-[#0E0E0E]">70 کیلو کالری ، 3.5 گرم پروتئین ، : 7.6
                    گرم کربوهیدرات ، 3 گرم چربی</span>
            </div>

            <div class="flex gap-[40px] items-center">

                <div class="size-[511px] relative">
                    <!-- background -->
                    <div class="bg-abali-darya w-full h-full rounded-full"></div>

                    <!-- slide 1 , 2 -->
                    <img class="absolute w-[360px] h-[640px] left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2" src="images/DOGH-BA-STAND.png" alt="دوغ آبعلی">
                    
                    <!-- slide 3 -->
                    <!-- <img class="absolute w-[360px] h-[640px] left-1/2 -translate-x-1/2 -top-24" src="images/DOGH-BA-STAND-3.png" alt="دوغ آبعلی"> -->
                </div>

                <!-- slider arrow -->
                <div class="flex flex-col gap-[10px]">
                    <!-- active slide -->
                    <div class="w-2 h-[76px] bg-abali-darya rounded-lg"></div>

                    <!-- not active slide -->
                    <div class="w-2 h-[40px] bg-abali-darya/25 rounded-lg cursor-pointer"></div>
                    <div class="w-2 h-[40px] bg-abali-darya/25 rounded-lg cursor-pointer"></div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
